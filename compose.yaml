name: sistema-pagos

services:
  db:
    image: postgres:17-alpine
    container_name: sistema-pagos-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: sistema-pagos-app
    restart: unless-stopped
    init: true

    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0

      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-sistema_pagos_session}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      GUEST_SESSION_HOURS: ${GUEST_SESSION_HOURS:-8}
      MAX_LOGIN_ATTEMPTS: ${MAX_LOGIN_ATTEMPTS:-5}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}

      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public

      FRONTEND_URL: http://localhost:${APP_PORT:-3000}

      ADMIN_NAME: ${ADMIN_NAME}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

      BACKUP_DIR: /app/backups/database
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-20}

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "${APP_PORT:-3000}:3000"

    volumes:
      - ./backups/database:/app/backups/database

    command: >
      sh -c "cd backend &&
             node node_modules/prisma/build/index.js migrate deploy &&
             node node_modules/prisma/build/index.js db seed &&
             node node_modules/tsx/dist/cli.mjs src/server.ts"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  postgres_data:
    name: sistema-pagos-postgres-data